[package]
name = "digital-paper-rust-provider"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
thiserror.workspace = true
digital-paper-domain = { path = "../digital-paper-domain" }
serde.workspace = true
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "cookies"] }
openssl = "0.10"
base64 = "0.22"
percent-encoding = "2.3"
num-bigint = "0.4"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
if-addrs = "0.13"
